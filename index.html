const imagePacks = new Map();
const bundledSources = new Map();
async function bundledImage(id) {
    if (!Object.hasOwn(bundledFiles, id)) return null;
    if (bundledSources.has(id)) return bundledSources.get(id);
    const [file, offset, size] = bundledFiles[id];
    if (!imagePacks.has(file)) {
        const request = fetch("./legends-assets/" + file).then(response => {
            if (!response.ok) throw new Error("تعذّر تحميل صور المنتج");
            return response.blob();
        }).catch(error => {
            imagePacks.delete(file);
            throw error;
        });
        imagePacks.set(file, request);
    }
    const pack = await imagePacks.get(file);
    if (!bundledSources.has(id)) {
        bundledSources.set(id, URL.createObjectURL(pack.slice(offset, offset + size, "image/webp")));
    }
    return bundledSources.get(id);
}

// ===== قراءة المنتجات والصور من Supabase على دفعات =====
let OFFERS_SUPPORTED = false;
async function loadProductsFromDB() {
    const fetchAll = async (query) => {
        const out = [];
        let batchSize = 250;
        while (true) {
            let batch;
            try {
                const res = await sbRequest(query + "&limit=" + batchSize + "&offset=" + out.length, { cache: "no-store" });
                batch = await res.json();
            } catch (e) {
                const message = e instanceof Error ? e.message : String(e);
                const canReduce = /مهلة|timeout|timed out|Failed to fetch|Load failed|NetworkError|network connection|^Supabase (413|500|502|503|504)\b/i.test(message);
                if (!canReduce || batchSize === 1) throw e;
                batchSize = Math.max(1, Math.floor(batchSize / 2));
                continue;
            }
            if (!batch.length) break;
            out.push(...batch);
        }
        return out;
    };
    const generation = ++fallbackGeneration;
    currentFallbackIds = new Set();
    fetchAll("products_norm?select=id&image_url=is.null&order=id.asc")
        .then(rows => { if (generation === fallbackGeneration) currentFallbackIds = new Set(rows.map(row => row.id)); })
        .catch(() => {});
    let rows;
    try {
        rows = await fetchAll("products_norm?select=id,name,category,price,old_price,on_offer,variants(size,color,stock)&order=sort_order.asc,id.asc");
        OFFERS_SUPPORTED = true;
    } catch (e) {
        const message = e instanceof Error ? e.message : String(e);
        if (!/42703|PGRST204/.test(message) || !/old_price|on_offer/.test(message)) throw e;
        rows = await fetchAll("products_norm?select=id,name,category,price,variants(size,color,stock)&order=sort_order.asc,id.asc");
        OFFERS_SUPPORTED = false;
    }
    return rows.map(r => ({
        id: r.id,
        name: r.name,
        category: r.category,
        price: Number(r.price) || 0,
        onOffer: !!r.on_offer,
        oldPrice: Number(r.old_price) || 0,
        variants: (r.variants || []).map(v => ({
            size: v.size, color: v.color, stock: Number(v.stock) || 0
        }))
    }));
}

// تحميل الصورة عند ظهور بطاقة المنتج، بدون تأخير الكتالوج.
let currentFallbackIds = new Set();
let fallbackGeneration = 0;
const productImages = new Map();
const pendingImageRequests = [];
let imageRequestTimer;

async function fetchImageBatch(batch) {
    try {
        const ids = batch.map(({ id }) => '"' + id.replace(/[\\"]/g, "\\$&") + '"');
        const filter = batch.length === 1
            ? "eq." + encodeURIComponent(batch[0].id)
            : "in." + encodeURIComponent("(" + ids.join(",") + ")");
        const response = await sbRequest("products_norm?select=id,image_url&id=" + filter, { cache: "no-store" });
        const images = new Map((await response.json()).map(row => [row.id, row.image_url]));
        for (const { id, resolve } of batch) {
            resolve(images.get(id) ?? bundledImage(id));
        }
    } catch (error) {
        if (batch.length === 1) {
            batch[0].reject(error);
        } else {
            // Older uploaded images may be stored inline and exceed a batch response limit.
            for (const entry of batch) await fetchImageBatch([entry]);
        }
    }
}

function loadProductImage(id) {
    if (!productImages.has(id)) {
        const request = new Promise((resolve, reject) => {
            if (currentFallbackIds.has(id)) {
                resolve(bundledImage(id));
                return;
            }
            pendingImageRequests.push({ id, resolve, reject });
            if (imageRequestTimer !== undefined) return;
            imageRequestTimer = setTimeout(() => {
                imageRequestTimer = undefined;
                const pending = pendingImageRequests.splice(0);
                for (let start = 0; start < pending.length; start += 8) {
                    fetchImageBatch(pending.slice(start, start + 8));
                }
            }, 20);
        }).catch(error => {
            if (productImages.get(id) === request) productImages.delete(id);
            throw error;
        });

async function upsertProductDB(p) {
    const isBundled = !!p.image && p.image === bundledSources.get(p.id);
    await sbRequest("products_norm", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{
            id: p.id, name: p.name, category: p.category,
            price: Number(p.price) || 0,
            ...(OFFERS_SUPPORTED ? { on_offer: !!p.onOffer, old_price: p.onOffer ? (Number(p.oldPrice) || null) : null } : {}),
            image_url: isBundled ? null : (p.image || null)
        }])
    });
    await sbRequest("variants?product_id=eq." + encodeURIComponent(p.id), { method: "DELETE" });
    const vs = (p.variants || []).map(v => ({
        product_id: p.id, size: v.size, color: v.color, stock: Number(v.stock) || 0
    }));
    if (vs.length) {
        await sbRequest("variants", {
            method: "POST",
            headers: { Prefer: "return=minimal" },
            body: JSON.stringify(vs)
        });
    }
}

async function updateProductDB(product, previous) {
    const changes = {};
    for (const field of ["name", "category", "price"]) {
        if (product[field] !== previous[field]) changes[field] = product[field];
    }
    if (product.image !== previous.image) changes.image_url = product.image ?? "";
    if (OFFERS_SUPPORTED) {
        if (product.onOffer !== previous.onOffer) changes.on_offer = product.onOffer;
        const oldPrice = product.onOffer ? product.oldPrice || null : null;
        const previousPrice = previous.onOffer ? previous.oldPrice || null : null;
        if (oldPrice !== previousPrice) changes.old_price = oldPrice;
    }
    const productFilter = "id=eq." + encodeURIComponent(product.id);
    if (Object.keys(changes).length) {
        const response = await sbRequest("products_norm?" + productFilter + "&select=id", {
            method: "PATCH",
            headers: { Prefer: "return=representation" },
            body: JSON.stringify(changes)
        });
        if (!(await response.json()).length) throw new Error("قاعدة البيانات ما أكدت حفظ المنتج");
    }

    const keyOf = variant => JSON.stringify([variant.size, variant.color]);
    const before = new Map((previous.variants || []).map(v => [keyOf(v), v]));
    const after = new Set(product.variants.map(keyOf));
    const updates = product.variants.filter(v => before.get(keyOf(v))?.stock !== v.stock);
    if (updates.length) {
        await sbRequest("variants?on_conflict=product_id,size,color", {
            method: "POST",
            headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(updates.map(v => ({ product_id: product.id, size: v.size, color: v.color, stock: v.stock })))
        });
    }
    for (const [key, variant] of before) {
        if (after.has(key)) continue;
        const query = "variants?product_id=eq." + encodeURIComponent(product.id)
            + "&size=eq." + encodeURIComponent(variant.size)
            + "&color=eq." + encodeURIComponent(variant.color);
        await sbRequest(query, { method: "DELETE" });
    }
}

}

function useReveal() {
    useEffect(() => {
        const els = Array.from(document.querySelectorAll(".rv"));
        if (!("IntersectionObserver" in window)) {
            els.forEach(el => el.classList.add("rv-in"));
            return;
        }
        const io = new IntersectionObserver((entries) => {
            entries.forEach(en => {
                if (en.isIntersecting) {
                    en.target.classList.add("rv-in");
                    io.unobserve(en.target);
                }
            });
        }, { threshold: 0.16, rootMargin: "0px 0px -8% 0px" });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
    }, []);
}
